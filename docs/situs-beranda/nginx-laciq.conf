# Templat vhost untuk laciq.solusimandiri.id (belum dipasang). Salinan pola dari
# dompetku.hardan-ti.com.conf. Pasang ke /etc/nginx/sites-available/, tautkan ke
# sites-enabled, lalu jalankan certbot untuk menambahkan blok SSL dan pengalihan 80->443.
# Sengaja TANPA geo-block Indonesia (peninjau Google Play di luar negeri harus bisa
# membuka halaman). Hanya /, /privacy, /template-buku-kas-umkm, /unduh/, /robots.txt, /sitemap.xml, /app-ads.txt, /img/, /fonts/ yang dilayani; path lain 404.
server {
    server_name laciq.solusimandiri.id;

    root /var/www/laciq.solusimandiri.id;

    access_log /var/log/nginx/laciq-access.log;
    error_log  /var/log/nginx/laciq-error.log;

    include snippets/cloudflare-realip.conf;
    include snippets/security-headers.conf;
    if ($is_banned) { return 429; }
    limit_req zone=general_req burst=60 nodelay;
    limit_conn general_conn 30;

    location ^~ /.well-known/ { allow all; }

    location ~ ^/privacy/?$ {
        default_type text/html;
        try_files /privacy/index.html =404;
    }

    location = / {
        default_type text/html;
        try_files /index.html =404;
    }

    location ~ ^/template-buku-kas-umkm/?$ {
        default_type text/html;
        try_files /template-buku-kas-umkm/index.html =404;
    }

    location ^~ /unduh/ {
        include snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
        try_files /robots.txt =404;
    }

    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600" always;
        try_files /sitemap.xml =404;
    }

    location ^~ /img/ {
        include snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    location ^~ /fonts/ {
        include snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    location / { return 404; }

    # listen 443 ssl ... dan sertifikat ditambahkan oleh certbot.
}
