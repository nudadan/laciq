name = "dompetku-receipt-extraction"
main = "src/index.ts"
compatibility_date = "2026-09-29"

# Alamat publik Worker (zona hardan-ti.com ada di Cloudflare). Satu tingkat di bawah
# domain supaya tercakup sertifikat HTTPS gratis. workers.dev tidak dipakai.
workers_dev = false
routes = [{ pattern = "dompetku-api.hardan-ti.com", custom_domain = true }]

[vars]
ULTIMATE_ENTITLEMENT = "ultimate"
MONTHLY_LIMIT = "300"
# Batas per hari per pengguna (0 = tanpa batas harian). Membatasi kerugian bila
# satu ID pengguna bocor.
DAILY_LIMIT = "15"

# Ringkasan laporan bulanan dengan AI (/report-insight), kuota TERPISAH dari scan.
# Biaya per ringkasan kecil (perkiraan Rp30), jadi batasnya longgar tetapi tetap ada.
REPORT_MONTHLY_LIMIT = "30"
REPORT_DAILY_LIMIT = "5"

# --- Uji coba Ultimate 30 hari tanpa kartu (docs/RENCANA-IMPLEMENTASI-TRIAL-ULTIMATE.md) ---
# BAWAAN MATI. Sebelum menyalakan: `npx wrangler secret put TRIAL_HASH_SECRET` (acak panjang), lalu
# ubah TRIAL_ENABLED menjadi "1" dan deploy. Rahasia itu TIDAK boleh berubah setelah dipakai:
# mengubahnya membuat semua catatan perangkat tak terbaca (semua orang tampak baru).
TRIAL_ENABLED = "0"
TRIAL_DAYS = "30"
PREMIUM_ENTITLEMENT = "premium"
# Kuota AI pengguna uji coba (hibah promosional); pelanggan berbayar memakai kuota di atas.
# Biaya terburuk per trial ≈ 60 x Rp4,6 + 6 x Rp30 ≈ Rp456.
TRIAL_MONTHLY_LIMIT = "60"
TRIAL_DAILY_LIMIT = "10"
TRIAL_REPORT_MONTHLY_LIMIT = "6"
TRIAL_REPORT_DAILY_LIMIT = "2"
# Klaim BARU maksimal per hari (UTC); meratakan lonjakan.
TRIAL_DAILY_CLAIM_CAP = "300"
# Catatan perangkat (kode ber-hash + ID anonim + waktu) disimpan sekian hari SETELAH uji coba berakhir,
# lalu terhapus otomatis; setelah itu perangkat boleh mencoba lagi. Harus sama dengan kebijakan privasi
# bagian 6c dan 9 ("sekitar 12 bulan"). Terapkan SEBELUM TRIAL_ENABLED pertama kali "1": catatan yang
# sudah ditulis tanpa TTL tidak akan kedaluwarsa sendiri.
TRIAL_RECORD_RETENTION_DAYS = "365"
# Batas penegakan anggaran AI promo global (Rupiah per bulan). Plafon yang direlakan Rp1.500.000;
# batas dipasang 90% dari itu karena penghitung KV tidak atomik. 0/kosong = AI uji coba mati.
PROMO_AI_MONTHLY_BUDGET_RP = "1350000"
# Play Integrity: off | shadow | lenient | strict. Pendekode token belum dipasang, jadi "shadow"
# hanya mencatat vonis "unavailable"; JANGAN memakai lenient/strict sebelum pendekode ada.
INTEGRITY_MODE = "shadow"

# Penyedia dan model AI. Penyedia: "gemini" (satu-satunya yang didukung).
# ID model SENGAJA di sini, bukan di kode, supaya ganti model tidak perlu rilis.
# Pilih model lewat evaluasi (eval/), lihat docs/RENCANA-IMPLEMENTASI-ULTIMATE-LANJUTAN.md B3.
AI_PROVIDER = "gemini"
AI_MODEL = "gemini-3.1-flash-lite"
# Model cadangan (dipisah koma), dicoba berurutan bila model utama gagal, mis. dihentikan
# Google (HTTP 404). Keduanya lolos eval 10/10 untuk total dan tanggal (lihat eval/ dan
# docs/RENCANA-IMPLEMENTASI-ULTIMATE-LANJUTAN.md §8). Urut dari yang termurah; yang
# kedua lebih mahal, jadi hanya terpakai bila dua model pertama gagal.
# Pantau log "ai_model_failed": itu tanda model utama bermasalah.
AI_MODEL_FALLBACK = "gemini-3.5-flash-lite,gemini-3.8-flash"
# Opsional: thinkingConfig mentah untuk Gemini (JSON). Kosongkan sampai
# diverifikasi dengan satu permintaan nyata (B0.1). Contoh seri 3:
#   AI_THINKING_CONFIG = '{"thinkingLevel":"minimal"}'
# Token berpikir ditagih sebagai token keluaran.
# AI_THINKING_CONFIG = ""

# Buat dulu: `npx wrangler kv namespace create RATE_LIMIT`, lalu tempel id-nya di sini.
# Dipakai untuk penghitung pemakaian DAN cache entitlement (kunci berawalan "ent:").
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "85728dd92a8d4c4dbf7de95efeefbd56"

# Opsional: pembatas laju per IP (Cloudflare Rate Limiting). Tanpa binding ini
# pembatasan IP dilewati. Sintaks: lihat dokumentasi Cloudflare "Rate Limiting"
# untuk Workers, lalu aktifkan blok berikut.
# [[ratelimits]]
# name = "IP_LIMITER"
# namespace_id = "1001"
# simple = { limit = 30, period = 60 }

# Rahasia (jangan ditaruh di file ini):
#   npx wrangler secret put GEMINI_API_KEY          # kunci PAID TIER, project Google Cloud khusus
#   npx wrangler secret put REVENUECAT_SECRET_KEY
#   npx wrangler secret put TRIAL_HASH_SECRET       # hanya untuk uji coba; jangan diubah setelah dipakai
